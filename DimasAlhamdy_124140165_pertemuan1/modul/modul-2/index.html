<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas JavaScript Dasar</title>
</head>
<body>
    <h1>Belajar JavaScript Dasar</h1>

    <!-- Form Sederhana untuk Kalkulator BMI (Event Handler) -->
    <h2>Kalkulator BMI</h2>
    <form id="bmiForm">
        <label for="berat">Berat Badan (kg):</label>
        <input type="number" id="berat" placeholder="Contoh: 65" required>
        <br><br>
        <label for="tinggi">Tinggi Badan (cm):</label>
        <input type="number" id="tinggi" placeholder="Contoh: 170" required>
        <br><br>
        <button type="submit">Hitung BMI</button>
    </form>
    <p id="bmiResult"></p>

    <hr>

    <h2>Hasil Program Lainnya</h2>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
