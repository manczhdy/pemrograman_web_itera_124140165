###
# app configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:pyramid_mahasiswa

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.includes =
    pyramid_debugtoolbar

# Toolbar hanya muncul untuk client dari localhost.
debugtoolbar.hosts = 127.0.0.1 ::1

# PostgreSQL adalah database utama aplikasi (sesuai modul praktikum).
# Kualifikasi +psycopg2 diperlukan karena SQLAlchemy 2.1 memakai psycopg v3
# sebagai dialek default; driver terpasang adalah psycopg2-binary.
sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = localhost:6543

###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARN" logs neither.  (Recommended for production systems.)

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

###
# alembic configuration
#
# Jalankan perintah Alembic dari root proyek (sejajar development.ini):
#   alembic -c development.ini revision --autogenerate -m "..."
#   alembic -c development.ini upgrade head
###

[alembic]
# path to migration scripts
script_location = pyramid_mahasiswa/alembic
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s
# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false
# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false
# version locations ...
version_locations = pyramid_mahasiswa/alembic/versions
# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8
# pastikan package pyramid_mahasiswa bisa di-import saat Alembic berjalan
prepend_sys_path = .
